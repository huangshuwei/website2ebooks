[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "website2ebooks"
version = "0.1.0"
description = "Generate EPUB ebooks from website content"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.0",
    "ebooklib>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
website2ebooks = "website2ebooks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
